[workspace]
members = ["crates/app", "crates/rough", "crates/scene", "crates/testkit"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wayland", "wgpu"] }
egui-wgpu = "=0.36.2"
getrandom = "0.3"
glyphon = "=0.12.0"
lyon = "1.0.19"
pollster = "0.4"
regex = "1"
rough = { path = "crates/rough" }
scene = { path = "crates/scene" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
testkit = { path = "crates/testkit" }
toml = "0.8"
wgpu = "30"
