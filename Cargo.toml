[workspace]
members = ["crates/rough", "crates/testkit"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
rough = { path = "crates/rough" }
serde_json = { version = "1", features = ["float_roundtrip"] }
testkit = { path = "crates/testkit" }
